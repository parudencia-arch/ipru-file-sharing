<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DropPin — Share Anything, Instantly</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f14;
    --surface:   #161a22;
    --border:    #242833;
    --accent:    #5b6cff;
    --accent2:   #a78bfa;
    --success:   #34d399;
    --danger:    #f87171;
    --warn:      #fbbf24;
    --text:      #e8eaf0;
    --muted:     #6b7280;
    --mono:      'Space Mono', monospace;
    --sans:      'Inter', system-ui, sans-serif;
  }

  html, body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ─── LAYOUT ─────────────────────────────────────── */
  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(12px);
    z-index: 10;
  }

  .logo {
    font-family: var(--mono);
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent2); }

  .tagline {
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    width: 100%;
    max-width: 560px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }

  /* ─── TABS ─────────────────────────────────────── */
  .tabs {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 28px;
    gap: 4px;
  }
  .tab-btn {
    flex: 1;
    padding: 9px 0;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 12px rgba(91,108,255,0.4);
  }
  .tab-btn:hover:not(.active) { color: var(--text); background: var(--border); }

  /* ─── PANELS ────────────────────────────────────── */
  .panel { display: none; }
  .panel.active { display: block; }

  /* ─── FORM ELEMENTS ─────────────────────────────── */
  label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 7px;
  }

  textarea, input[type=text], input[type=number] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.9rem;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.18s;
    resize: vertical;
  }
  textarea:focus, input:focus { border-color: var(--accent); }
  textarea { min-height: 100px; }

  .field { margin-bottom: 18px; }

  /* ─── DROP ZONE ─────────────────────────────────── */
  .dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    background: var(--bg);
    margin-bottom: 18px;
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: var(--accent);
    background: rgba(91,108,255,0.06);
  }
  .dropzone input[type=file] {
    position: absolute; inset: 0;
    opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .dropzone-icon { font-size: 2rem; margin-bottom: 8px; }
  .dropzone-text { font-size: 0.88rem; color: var(--muted); }
  .dropzone-text strong { color: var(--accent); }
  .file-info {
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--success);
    display: none;
  }

  /* ─── BUTTONS ───────────────────────────────────── */
  .btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.18s ease;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 16px rgba(91,108,255,0.35);
  }
  .btn-primary:hover { background: #6b7cff; box-shadow: 0 6px 20px rgba(91,108,255,0.5); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--border); }
  .btn-success { background: var(--success); color: #0d0f14; }
  .btn-success:hover { background: #4ade80; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

  /* ─── PIN DISPLAY ────────────────────────────────── */
  .pin-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
    display: none;
  }
  .pin-box.show { display: block; }
  .pin-label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
  .pin-value {
    font-family: var(--mono);
    font-size: 2.4rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3em;
    cursor: pointer;
    transition: color 0.2s;
  }
  .pin-value:hover { color: var(--accent2); }
  .pin-hint { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }

  /* ─── PIN INPUT (RECEIVE) ────────────────────────── */
  .pin-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pin-digit {
    flex: 1;
    text-align: center;
    font-family: var(--mono);
    font-size: 1.6rem;
    font-weight: 700;
    padding: 10px 0;
    border: 2px solid var(--border);
    border-radius: 10px;
    background: var(--bg);
    color: var(--accent);
    outline: none;
    caret-color: var(--accent);
    max-width: 56px;
  }
  .pin-digit:focus { border-color: var(--accent); }

  /* ─── PROGRESS ───────────────────────────────────── */
  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin: 12px 0;
    display: none;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-bar.show { display: block; }

  /* ─── STATUS MESSAGE ─────────────────────────────── */
  .status {
    padding: 11px 14px;
    border-radius: 9px;
    font-size: 0.85rem;
    margin-bottom: 14px;
    display: none;
    align-items: flex-start;
    gap: 8px;
  }
  .status.show { display: flex; }
  .status.info  { background: rgba(91,108,255,0.12); border: 1px solid rgba(91,108,255,0.3); color: #a5b4fc; }
  .status.ok    { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.3); color: var(--success); }
  .status.err   { background: rgba(248,113,113,0.12); border: 1px solid rgba(248,113,113,0.3); color: var(--danger); }
  .status.warn  { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.3); color: var(--warn); }

  /* ─── RECEIVED CONTENT ───────────────────────────── */
  .received-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 14px;
    display: none;
  }
  .received-card.show { display: block; }
  .received-text-content {
    font-size: 0.88rem;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
    line-height: 1.7;
  }
  .received-text-content::-webkit-scrollbar { width: 4px; }
  .received-text-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .file-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(91,108,255,0.1);
    border: 1px solid rgba(91,108,255,0.25);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.83rem;
    color: var(--accent2);
    margin-bottom: 12px;
    word-break: break-all;
  }

  /* ─── EXPIRY / META ──────────────────────────────── */
  .meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.75rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .expiry-select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 0.82rem;
    padding: 5px 10px;
    outline: none;
    cursor: pointer;
  }

  /* ─── SPINNER ───────────────────────────────────── */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    flex-shrink: 0;
  }

  /* ─── COPY FEEDBACK ──────────────────────────────── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%);
    background: var(--success);
    color: #0d0f14;
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 0.85rem;
    font-weight: 600;
    z-index: 999;
    animation: fadeUp 0.25s ease;
    pointer-events: none;
  }

  /* ─── FOOTER ─────────────────────────────────────── */
  footer {
    text-align: center;
    padding: 18px;
    font-size: 0.73rem;
    color: var(--muted);
    border-top: 1px solid var(--border);
  }

  /* ─── RESPONSIVE ─────────────────────────────────── */
  @media (max-width: 480px) {
    .card { padding: 24px 16px; }
    header { padding: 14px 16px; }
    .pin-value { font-size: 1.9rem; }
    .pin-digit { font-size: 1.3rem; padding: 8px 0; max-width: 44px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <div class="logo">Drop<span>Pin</span></div>
      <div class="tagline">Secure · No install · Works everywhere</div>
    </div>
  </header>

  <main>
    <div class="card">

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('send')">📤 Send</button>
        <button class="tab-btn" onclick="switchTab('receive')">📥 Receive</button>
      </div>

      <!-- ════════════════ SEND PANEL ════════════════ -->
      <div id="panel-send" class="panel active">

        <div class="field">
          <label>Message (optional)</label>
          <textarea id="send-text" placeholder="Type your message here…"></textarea>
        </div>

        <div class="field">
          <label>File (optional, max 100 MB)</label>
          <div class="dropzone" id="dropzone">
            <input type="file" id="file-input" onchange="onFileSelect(this)">
            <div class="dropzone-icon">📁</div>
            <div class="dropzone-text"><strong>Click to browse</strong> or drag & drop</div>
            <div class="dropzone-text" style="margin-top:4px;font-size:0.76rem;">Any file type · Max 100 MB</div>
            <div class="file-info" id="file-info"></div>
          </div>
        </div>

        <div class="meta-row">
          <span>Auto-expire after</span>
          <select class="expiry-select" id="expiry-select">
            <option value="300">5 minutes</option>
            <option value="1800">30 minutes</option>
            <option value="3600" selected>1 hour</option>
            <option value="86400">24 hours</option>
          </select>
        </div>

        <div class="status" id="send-status"></div>
        <div class="progress-bar" id="send-progress"><div class="progress-fill" id="send-fill"></div></div>

        <div class="pin-box" id="pin-box">
          <div class="pin-label">Share this PIN</div>
          <div class="pin-value" id="pin-display" onclick="copyPin()" title="Click to copy">——————</div>
          <div class="pin-hint">Tap PIN to copy · Expires soon</div>
        </div>

        <button class="btn btn-primary" id="send-btn" onclick="doSend()">
          <span id="send-btn-label">Generate PIN & Share</span>
        </button>

        <button class="btn btn-secondary" id="reset-btn" onclick="resetSend()" style="margin-top:10px;display:none;">
          ↺ Share something else
        </button>

      </div>

      <!-- ════════════════ RECEIVE PANEL ════════════════ -->
      <div id="panel-receive" class="panel">

        <div class="field">
          <label>Enter 6-digit PIN</label>
          <div class="pin-input-row" id="pin-input-row">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,0)" onkeydown="pinDigitKey(this,0,event)">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,1)" onkeydown="pinDigitKey(this,1,event)">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,2)" onkeydown="pinDigitKey(this,2,event)">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,3)" onkeydown="pinDigitKey(this,3,event)">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,4)" onkeydown="pinDigitKey(this,4,event)">
            <input class="pin-digit" maxlength="1" type="text" inputmode="numeric" pattern="[0-9]*" oninput="pinDigitInput(this,5)" onkeydown="pinDigitKey(this,5,event)">
          </div>
        </div>

        <div class="status" id="recv-status"></div>

        <div class="received-card" id="recv-text-card">
          <label style="margin-bottom:10px;">Message</label>
          <div class="received-text-content" id="recv-text-content"></div>
          <button class="btn btn-secondary" onclick="copyReceivedText()" style="margin-top:12px;width:auto;padding:8px 16px;font-size:0.8rem;">Copy Text</button>
        </div>

        <div class="received-card" id="recv-file-card">
          <label style="margin-bottom:10px;">File</label>
          <div class="file-badge" id="recv-file-badge">📎 <span id="recv-file-name"></span></div>
          <button class="btn btn-success" id="download-btn" onclick="downloadFile()">
            ⬇️ Download File
          </button>
        </div>

        <button class="btn btn-primary" id="recv-btn" onclick="doReceive()">
          🔓 Unlock with PIN
        </button>

        <button class="btn btn-secondary" id="recv-reset-btn" onclick="resetReceive()" style="margin-top:10px;display:none;">
          ↺ Enter another PIN
        </button>

      </div>

    </div>
  </main>

  <footer>
    DropPin · Files are stored encrypted in your browser session · No server, no tracking
  </footer>

</div>

<script>
// ═══════════════════════════════════════════════════════════
//  DROPPIN — CORE ENGINE
//  Storage: window.storage (artifact persistent storage)
//  No P2P, no WebRTC, no external CDN dependencies
// ═══════════════════════════════════════════════════════════

let selectedFile = null;
let receivedFileData = null;
let receivedFileName = null;
let receivedFileMime = null;
let currentPin = null;

// ─── TAB SWITCHING ─────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && tab==='send')||(i===1 && tab==='receive')));
  document.getElementById('panel-send').classList.toggle('active', tab==='send');
  document.getElementById('panel-receive').classList.toggle('active', tab==='receive');
}

// ─── STATUS HELPERS ─────────────────────────────────────
function setStatus(id, type, msg) {
  const el = document.getElementById(id);
  el.className = 'status show ' + type;
  el.innerHTML = iconFor(type) + ' <span>' + msg + '</span>';
}
function hideStatus(id) { document.getElementById(id).className = 'status'; }
function iconFor(t) { return {info:'ℹ️',ok:'✅',err:'❌',warn:'⚠️'}[t]||''; }

// ─── FILE INPUT ──────────────────────────────────────────
function onFileSelect(input) {
  const f = input.files[0];
  if (!f) return;
  const MAX = 100 * 1024 * 1024;
  if (f.size > MAX) {
    setStatus('send-status','err','File exceeds 100 MB limit. Please choose a smaller file.');
    input.value = '';
    selectedFile = null;
    return;
  }
  selectedFile = f;
  const fi = document.getElementById('file-info');
  fi.textContent = '✓ ' + f.name + ' (' + humanSize(f.size) + ')';
  fi.style.display = 'block';
  hideStatus('send-status');
}

function humanSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}

// ─── DRAG & DROP ─────────────────────────────────────────
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', e => {
  e.preventDefault(); dz.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const dt = new DataTransfer(); dt.items.add(f);
  const inp = document.getElementById('file-input');
  inp.files = dt.files;
  onFileSelect(inp);
});

// ─── PIN GENERATION ──────────────────────────────────────
function genPin() {
  return String(Math.floor(100000 + Math.random() * 900000));
}

// ─── SEND FLOW ───────────────────────────────────────────
async function doSend() {
  const text = document.getElementById('send-text').value.trim();
  if (!text && !selectedFile) {
    setStatus('send-status','warn','Please add a message or select a file before sharing.');
    return;
  }

  const btn = document.getElementById('send-btn');
  const label = document.getElementById('send-btn-label');
  btn.disabled = true;
  label.innerHTML = '<div class="spinner"></div> Preparing…';
  hideStatus('send-status');

  try {
    // Read file as base64 if present
    let fileB64 = null, fileName = null, fileMime = null;
    if (selectedFile) {
      setStatus('send-status','info','Reading file… this may take a moment for large files.');
      const progress = document.getElementById('send-progress');
      const fill = document.getElementById('send-fill');
      progress.classList.add('show');

      fileB64 = await readFileAsBase64(selectedFile, (pct) => {
        fill.style.width = pct + '%';
      });
      fileName = selectedFile.name;
      fileMime = selectedFile.type || 'application/octet-stream';
      fill.style.width = '100%';
      hideStatus('send-status');
    }

    const pin = genPin();
    const expiry = parseInt(document.getElementById('expiry-select').value, 10);
    const expiresAt = Date.now() + expiry * 1000;

    // Build payload — store in chunks if needed (5MB limit per key)
    const payload = {
      text: text || null,
      fileName: fileName,
      fileMime: fileMime,
      expiresAt: expiresAt,
      hasFile: !!fileB64,
      createdAt: Date.now()
    };

    // Store metadata
    label.innerHTML = '<div class="spinner"></div> Saving…';
    await storage_set('pin:' + pin + ':meta', JSON.stringify(payload));

    // Store file in chunks of ~3.5MB base64 (safe under 5MB limit)
    if (fileB64) {
      const CHUNK = 3500000;
      const numChunks = Math.ceil(fileB64.length / CHUNK);
      payload.numChunks = numChunks;
      for (let i = 0; i < numChunks; i++) {
        const chunk = fileB64.slice(i * CHUNK, (i+1) * CHUNK);
        await storage_set('pin:' + pin + ':file:' + i, chunk);
        label.innerHTML = '<div class="spinner"></div> Uploading… ' + Math.round((i+1)/numChunks*100) + '%';
      }
      // Update meta with chunk count
      payload.numChunks = numChunks;
      await storage_set('pin:' + pin + ':meta', JSON.stringify(payload));
    }

    // Show pin
    currentPin = pin;
    document.getElementById('pin-display').textContent = pin;
    document.getElementById('pin-box').classList.add('show');
    document.getElementById('send-progress').classList.remove('show');
    setStatus('send-status','ok','Shared! Give the PIN to the recipient.');
    label.textContent = 'Shared ✓';
    document.getElementById('reset-btn').style.display = 'block';

  } catch(e) {
    console.error(e);
    setStatus('send-status','err','Failed to share: ' + (e.message||'Unknown error'));
    btn.disabled = false;
    label.textContent = 'Generate PIN & Share';
    document.getElementById('send-progress').classList.remove('show');
  }
}

// ─── READ FILE AS BASE64 ──────────────────────────────────
function readFileAsBase64(file, onProgress) {
  return new Promise((resolve, reject) => {
    // For large files, use chunked FileReader for progress
    const chunkSize = 2 * 1024 * 1024; // 2MB chunks
    const chunks = [];
    let offset = 0;

    function readNext() {
      const slice = file.slice(offset, offset + chunkSize);
      const reader = new FileReader();
      reader.onload = e => {
        // ArrayBuffer chunk → base64
        const arr = new Uint8Array(e.target.result);
        let binary = '';
        for (let i = 0; i < arr.length; i++) binary += String.fromCharCode(arr[i]);
        chunks.push(btoa(binary));
        offset += chunkSize;
        const pct = Math.min(100, Math.round(offset / file.size * 100));
        if (onProgress) onProgress(pct);
        if (offset < file.size) { readNext(); }
        else { resolve(chunks.join('')); }
      };
      reader.onerror = reject;
      reader.readAsArrayBuffer(slice);
    }
    readNext();
  });
}

// ─── STORAGE WRAPPERS (with localStorage fallback) ────────
async function storage_set(key, value) {
  // Primary: artifact persistent storage
  if (window.storage && typeof window.storage.set === 'function') {
    const r = await window.storage.set(key, value, true); // shared=true for cross-user access
    if (!r) throw new Error('Storage write failed');
    return r;
  }
  // Fallback: sessionStorage (same-browser sharing)
  try { sessionStorage.setItem(key, value); return true; } catch(e) { throw new Error('Storage full or unavailable'); }
}

async function storage_get(key) {
  if (window.storage && typeof window.storage.get === 'function') {
    try {
      const r = await window.storage.get(key, true); // shared=true
      return r ? r.value : null;
    } catch(e) { return null; }
  }
  return sessionStorage.getItem(key);
}

async function storage_delete(key) {
  if (window.storage && typeof window.storage.get === 'function') {
    try { await window.storage.delete(key, true); } catch(e) {}
  } else {
    sessionStorage.removeItem(key);
  }
}

// ─── RECEIVE FLOW ─────────────────────────────────────────
function getPinFromDigits() {
  const digits = document.querySelectorAll('.pin-digit');
  let pin = '';
  digits.forEach(d => pin += d.value);
  return pin;
}

async function doReceive() {
  const pin = getPinFromDigits();
  if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
    setStatus('recv-status','warn','Please enter all 6 digits of the PIN.');
    return;
  }

  const btn = document.getElementById('recv-btn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> Looking up PIN…';
  hideStatus('recv-status');

  // Hide previous results
  document.getElementById('recv-text-card').classList.remove('show');
  document.getElementById('recv-file-card').classList.remove('show');
  receivedFileData = null;

  try {
    const metaRaw = await storage_get('pin:' + pin + ':meta');
    if (!metaRaw) {
      setStatus('recv-status','err','PIN not found. Check the digits or ask the sender to re-share.');
      btn.disabled = false;
      btn.textContent = '🔓 Unlock with PIN';
      return;
    }

    const meta = JSON.parse(metaRaw);

    // Check expiry
    if (meta.expiresAt && Date.now() > meta.expiresAt) {
      setStatus('recv-status','err','This PIN has expired. Ask the sender to share again.');
      // Clean up
      await storage_delete('pin:' + pin + ':meta');
      btn.disabled = false;
      btn.textContent = '🔓 Unlock with PIN';
      return;
    }

    // Show text
    if (meta.text) {
      document.getElementById('recv-text-content').textContent = meta.text;
      document.getElementById('recv-text-card').classList.add('show');
    }

    // Reassemble file
    if (meta.hasFile && meta.numChunks) {
      btn.innerHTML = '<div class="spinner"></div> Downloading file…';
      let b64 = '';
      for (let i = 0; i < meta.numChunks; i++) {
        const chunk = await storage_get('pin:' + pin + ':file:' + i);
        if (chunk === null) throw new Error('File chunk ' + i + ' missing.');
        b64 += chunk;
        btn.innerHTML = '<div class="spinner"></div> Downloading… ' + Math.round((i+1)/meta.numChunks*100) + '%';
      }
      receivedFileData = b64;
      receivedFileName = meta.fileName;
      receivedFileMime = meta.fileMime;
      document.getElementById('recv-file-name').textContent = meta.fileName;
      document.getElementById('recv-file-card').classList.add('show');
    }

    if (!meta.text && !meta.hasFile) {
      setStatus('recv-status','warn','PIN is valid but no content was found.');
    } else {
      setStatus('recv-status','ok','Content unlocked!');
    }

    btn.style.display = 'none';
    document.getElementById('recv-reset-btn').style.display = 'block';

  } catch(e) {
    console.error(e);
    setStatus('recv-status','err','Error: ' + (e.message || 'Could not retrieve content.'));
    btn.disabled = false;
    btn.textContent = '🔓 Unlock with PIN';
  }
}

// ─── DOWNLOAD FILE ────────────────────────────────────────
function downloadFile() {
  if (!receivedFileData) return;
  try {
    // Convert base64 → Blob
    const binary = atob(receivedFileData);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes], { type: receivedFileMime || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = receivedFileName || 'download';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
    showToast('Download started!');
  } catch(e) {
    setStatus('recv-status','err','Download failed: ' + e.message);
  }
}

// ─── RESET ────────────────────────────────────────────────
function resetSend() {
  document.getElementById('send-text').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('file-info').style.display = 'none';
  selectedFile = null;
  currentPin = null;
  document.getElementById('pin-box').classList.remove('show');
  document.getElementById('pin-display').textContent = '——————';
  document.getElementById('send-btn').disabled = false;
  document.getElementById('send-btn-label').textContent = 'Generate PIN & Share';
  document.getElementById('reset-btn').style.display = 'none';
  document.getElementById('send-progress').classList.remove('show');
  hideStatus('send-status');
}

function resetReceive() {
  document.querySelectorAll('.pin-digit').forEach(d => d.value = '');
  document.querySelectorAll('.pin-digit')[0].focus();
  document.getElementById('recv-text-card').classList.remove('show');
  document.getElementById('recv-file-card').classList.remove('show');
  receivedFileData = null;
  document.getElementById('recv-btn').style.display = 'flex';
  document.getElementById('recv-btn').disabled = false;
  document.getElementById('recv-btn').textContent = '🔓 Unlock with PIN';
  document.getElementById('recv-reset-btn').style.display = 'none';
  hideStatus('recv-status');
}

// ─── PIN DIGIT INPUT HANDLING ─────────────────────────────
function pinDigitInput(el, idx) {
  const val = el.value.replace(/\D/g,'');
  el.value = val.slice(-1);
  if (val && idx < 5) {
    document.querySelectorAll('.pin-digit')[idx+1].focus();
  }
  // Auto-submit when all 6 filled
  const pin = getPinFromDigits();
  if (pin.length === 6 && /^\d{6}$/.test(pin)) {
    setTimeout(doReceive, 80);
  }
}

function pinDigitKey(el, idx, e) {
  if (e.key === 'Backspace' && !el.value && idx > 0) {
    document.querySelectorAll('.pin-digit')[idx-1].focus();
  }
  if (e.key === 'ArrowLeft' && idx > 0) document.querySelectorAll('.pin-digit')[idx-1].focus();
  if (e.key === 'ArrowRight' && idx < 5) document.querySelectorAll('.pin-digit')[idx+1].focus();
  // Handle paste
  if ((e.ctrlKey || e.metaKey) && e.key === 'v') {
    e.preventDefault();
    navigator.clipboard.readText().then(text => {
      const digits = text.replace(/\D/g,'').slice(0,6);
      const inputs = document.querySelectorAll('.pin-digit');
      digits.split('').forEach((d,i) => { if(inputs[i]) inputs[i].value = d; });
      if (digits.length === 6) setTimeout(doReceive, 80);
      else if (inputs[digits.length]) inputs[digits.length].focus();
    }).catch(() => {});
  }
}

// ─── COPY HELPERS ─────────────────────────────────────────
function copyPin() {
  const pin = document.getElementById('pin-display').textContent;
  if (!pin || pin.includes('—')) return;
  navigator.clipboard.writeText(pin).then(() => showToast('PIN copied!')).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = pin; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    showToast('PIN copied!');
  });
}

function copyReceivedText() {
  const text = document.getElementById('recv-text-content').textContent;
  navigator.clipboard.writeText(text).then(() => showToast('Text copied!')).catch(() => {});
}

function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// ─── STORAGE AVAILABILITY CHECK ───────────────────────────
window.addEventListener('load', () => {
  // Warm up — check if artifact storage is present
  if (!window.storage) {
    // sessionStorage fallback active — show note
    console.info('DropPin: Using sessionStorage fallback (same-browser sharing only).');
    // Add a small note in the footer
    const footer = document.querySelector('footer');
    if (footer) footer.textContent = 'DropPin · Running in local mode (same browser only) · No tracking';
  }
});
